<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="t">How the Agentic Job Search Kit works</title>
  <desc id="d">You say "help me with my job search" in plain words. The first time, it gets to know you: your resume, a conversation about your goals and your best work, and samples of your writing. It remembers five things: your resume, what you want, your stories, your voice and your tracker. After that you just ask: "what's new today" gets a job report, "tailor my resume to this job" gets a resume for that job, and "I have an interview Thursday" gets a one-page brief, and "fix up my LinkedIn" gets a profile that matches your resume. It keeps track of where you applied and which resume you sent. Your corrections flow back into what it remembers.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#0969da"/>
    </marker>
  </defs>

  <rect x="0.5" y="0.5" width="1199" height="599" rx="14" fill="#ffffff" stroke="#d0d7de"/>

  <text x="40" y="48" font-size="24" font-weight="700" fill="#1f2328">How it works</text>
  <text x="40" y="74" font-size="14" fill="#59636e">No commands to learn. Say <tspan font-weight="700" fill="#0969da">“Help me with my job search”</tspan> and it works out where you are and what to do next.</text>

  <g font-size="12" font-weight="700" fill="#0969da" letter-spacing="1">
    <text x="40" y="118">1  FIRST, IT GETS TO KNOW YOU</text>
    <text x="400" y="118">2  WHAT IT REMEMBERS</text>
    <text x="880" y="118">3  THEN YOU JUST ASK</text>
  </g>

  <!-- column 1 -->
  <rect x="40" y="132" width="280" height="300" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="60" y="164" font-size="15" font-weight="700" fill="#0969da">“Help me with my job search”</text>
  <text x="60" y="186" font-size="12" fill="#59636e">About 2 hours in total, a little at a time.</text>
  <text x="60" y="203" font-size="12" fill="#59636e">Your first job report comes after 4 questions.</text>
  <line x1="60" y1="220" x2="300" y2="220" stroke="#d0d7de"/>
  <g>
    <circle cx="70" cy="250" r="5" fill="#0969da"/>
    <text x="88" y="248" font-size="14" font-weight="600" fill="#1f2328">Your resume</text>
    <text x="88" y="266" font-size="12" fill="#59636e">drop it in, or just describe your work</text>
    <circle cx="70" cy="310" r="5" fill="#0969da"/>
    <text x="88" y="308" font-size="14" font-weight="600" fill="#1f2328">A conversation</text>
    <text x="88" y="326" font-size="12" fill="#59636e">what you want, and your best work</text>
    <circle cx="70" cy="370" r="5" fill="#0969da"/>
    <text x="88" y="368" font-size="14" font-weight="600" fill="#1f2328">Your writing</text>
    <text x="88" y="386" font-size="12" fill="#59636e">a few things you wrote yourself</text>
  </g>

  <line x1="326" y1="282" x2="392" y2="282" stroke="#0969da" stroke-width="2" marker-end="url(#a)"/>
  <text x="359" y="272" font-size="11" fill="#59636e" text-anchor="middle">builds</text>

  <!-- column 2 -->
  <g font-size="12" fill="#59636e">
    <g>
      <rect x="400" y="132" width="400" height="52" rx="8" fill="#ffffff" stroke="#d0d7de"/>
      <rect x="400" y="132" width="5" height="52" rx="2" fill="#0969da"/>
      <text x="420" y="154" font-size="14" font-weight="700" fill="#1f2328">Your resume</text>
      <text x="420" y="172">Word for word. The only source of facts.</text>
    </g>
    <g>
      <rect x="400" y="194" width="400" height="52" rx="8" fill="#ffffff" stroke="#d0d7de"/>
      <rect x="400" y="194" width="5" height="52" rx="2" fill="#0969da"/>
      <text x="420" y="216" font-size="14" font-weight="700" fill="#1f2328">What you want</text>
      <text x="420" y="234">Kinds of jobs, where, minimum pay, deal-breakers.</text>
    </g>
    <g>
      <rect x="400" y="256" width="400" height="52" rx="8" fill="#ffffff" stroke="#d0d7de"/>
      <rect x="400" y="256" width="5" height="52" rx="2" fill="#0969da"/>
      <text x="420" y="278" font-size="14" font-weight="700" fill="#1f2328">Your stories</text>
      <text x="420" y="296">Each win: what was wrong, what you did, what changed.</text>
    </g>
    <g>
      <rect x="400" y="318" width="400" height="52" rx="8" fill="#ffffff" stroke="#d0d7de"/>
      <rect x="400" y="318" width="5" height="52" rx="2" fill="#0969da"/>
      <text x="420" y="340" font-size="14" font-weight="700" fill="#1f2328">Your voice</text>
      <text x="420" y="358">How you write, and the words you would never use.</text>
    </g>
    <g>
      <rect x="400" y="380" width="400" height="52" rx="8" fill="#ffffff" stroke="#d0d7de"/>
      <rect x="400" y="380" width="5" height="52" rx="2" fill="#0969da"/>
      <text x="420" y="402" font-size="14" font-weight="700" fill="#1f2328">Your tracker</text>
      <text x="420" y="420">Jobs it has seen, where you applied, which resume you sent.</text>
    </g>
  </g>

  <line x1="806" y1="166" x2="872" y2="166" stroke="#0969da" stroke-width="2" marker-end="url(#a)"/>
  <line x1="806" y1="243" x2="872" y2="243" stroke="#0969da" stroke-width="2" marker-end="url(#a)"/>
  <line x1="806" y1="320" x2="872" y2="320" stroke="#0969da" stroke-width="2" marker-end="url(#a)"/>
  <line x1="806" y1="397" x2="872" y2="397" stroke="#0969da" stroke-width="2" marker-end="url(#a)"/>
  <text x="839" y="156" font-size="11" fill="#59636e" text-anchor="middle">used for</text>

  <!-- column 3 -->
  <rect x="880" y="132" width="280" height="68" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="900" y="155" font-size="14" font-weight="700" fill="#0969da">“What’s new today?”</text>
  <text x="900" y="174" font-size="13" font-weight="600" fill="#1f2328">A job report, every morning if you like</text>
  <text x="900" y="191" font-size="12" fill="#59636e">the best 3 to 5 open jobs, and why you fit</text>
  <rect x="880" y="209" width="280" height="68" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="900" y="232" font-size="14" font-weight="700" fill="#0969da">“Tailor my resume to this job”</text>
  <text x="900" y="251" font-size="13" font-weight="600" fill="#1f2328">A resume written for that job</text>
  <text x="900" y="268" font-size="12" fill="#59636e">true, targeted, and it sounds like you</text>
  <rect x="880" y="286" width="280" height="68" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="900" y="309" font-size="14" font-weight="700" fill="#0969da">“I have an interview Thursday”</text>
  <text x="900" y="328" font-size="13" font-weight="600" fill="#1f2328">A one-page brief</text>
  <text x="900" y="345" font-size="12" fill="#59636e">likely questions, matched to your stories</text>
  <rect x="880" y="363" width="280" height="68" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="900" y="386" font-size="14" font-weight="700" fill="#0969da">“Fix up my LinkedIn”</text>
  <text x="900" y="405" font-size="13" font-weight="600" fill="#1f2328">A profile that matches your resume</text>
  <text x="900" y="422" font-size="12" fill="#59636e">kept up to date as your stories change</text>

  <!-- feedback loop -->
  <path d="M1020 431V470" stroke="#0969da" stroke-width="2" fill="none" stroke-dasharray="5 4"/>
  <path d="M600 470V440" stroke="#0969da" stroke-width="2" fill="none" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <rect x="400" y="470" width="760" height="64" rx="10" fill="#ddf4ff" stroke="#0969da" stroke-dasharray="5 4"/>
  <text x="420" y="497" font-size="14" font-weight="700" fill="#1f2328">It learns from your corrections</text>
  <text x="420" y="517" font-size="12" fill="#3d4650">Change a line you don’t like and it writes more like you next time. Say “skip sales jobs” and tomorrow’s report does.</text>

  <text x="40" y="572" font-size="12" fill="#59636e"><tspan font-weight="700" fill="#1f2328">Three rules it always follows:</tspan> it never makes up a fact  ·  what it doesn’t know, it asks  ·  only your own writing counts as your voice</text>
</svg>
