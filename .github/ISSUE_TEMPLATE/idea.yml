name: Idea
description: Suggest an improvement.
labels: [idea]
body:
  - type: textarea
    id: problem
    attributes:
      label: What were you trying to do?
      description: Describe the situation, not the feature.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would have helped?
    validations:
      required: true
