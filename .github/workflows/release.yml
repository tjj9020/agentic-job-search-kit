name: Release

# On every push to main: if there are pending changesets, open (or update) a
# "chore: version skills" pull request that bumps the version and writes the
# changelog. Merging that pull request tags the release.

on:
  push:
    branches:
      - main

# No permissions by default; the job below asks for what it needs.
permissions: {}

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Version
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - name: Create version pull request
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version-script: npm run version
          publish-script: npx changeset tag
          commit-message: "chore: version skills"
          pr-title: "chore: version skills"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Desktop and web app users install by uploading ZIP files, so every
      # release carries them. The changesets step above creates the GitHub
      # release itself, so this step attaches the files to it. It runs on every
      # push to main and does nothing once the current version's release has
      # its files, which also repairs a release that was left without them.
      - name: Publish download files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="v$(node -p "require('./package.json').version")"
          if ! gh release view "$version" >/dev/null 2>&1; then
            echo "No release for $version yet. Nothing to publish."; exit 0
          fi
          if gh release view "$version" --json assets --jq '.assets[].name' | grep -qx 'job-search-kit-skills.zip'; then
            echo "Release $version already has its download files."; exit 0
          fi
          bash scripts/build-downloads.sh dist
          gh release upload "$version" dist/*.zip --clobber
