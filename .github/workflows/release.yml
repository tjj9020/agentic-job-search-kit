name: Release

# On every push to main: if there are pending changesets, open (or update) a
# "chore: version skills" pull request that bumps the version and writes the
# changelog. Merging that pull request tags the release.

on:
  push:
    branches:
      - main

# No permissions by default; the job below asks for what it needs.
permissions: {}

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Version
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - name: Create version pull request
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version-script: npm run version
          publish-script: npx changeset tag
          commit-message: "chore: version skills"
          pr-title: "chore: version skills"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Desktop and web app users install by uploading ZIP files, so every
      # release carries them. Runs when the current version has a tag but no
      # release yet, which is right after a version pull request is merged.
      - name: Publish download files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="v$(node -p "require('./package.json').version")"
          git fetch --tags --quiet
          if ! git rev-parse -q --verify "refs/tags/$version" >/dev/null; then
            echo "No tag for $version yet. Nothing to publish."; exit 0
          fi
          if gh release view "$version" >/dev/null 2>&1; then
            echo "Release $version already exists."; exit 0
          fi
          bash scripts/build-downloads.sh dist
          gh release create "$version" dist/*.zip --verify-tag --title "$version" \
            --notes "Download **job-search-kit-skills.zip** to install in a desktop or web app. Instructions are in the README. Changes are in CHANGELOG.md."
